#:schema node_modules/wrangler/config-schema.json
name = "questionforge"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[vars]
ENVIRONMENT = "production"
# GEMINI_API_KEY = "your-api-key-here"

# Optional Cloudflare KV binding for distributed persistent question storage across edge locations:
# Run: npx wrangler kv namespace create JEE_QUESTIONS_KV
# Then uncomment and fill your KV namespace id:
# [[kv_namespaces]]
# binding = "JEE_QUESTIONS_KV"
# id = "your_kv_namespace_id_here"
